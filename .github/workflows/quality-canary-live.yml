name: Temporary Live Quality Canary

on:
  push:
    branches: ["feat/fast-radar-core"]
    paths: [".github/workflows/quality-canary-live.yml"]

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "."
      - name: AirPods no-write canary pass 1
        continue-on-error: true
        run: python scripts/quality_canary.py --marketplace both --query "AirPods Pro 3" --limit 10
      - name: AirPods no-write canary pass 2
        continue-on-error: true
        run: python scripts/quality_canary.py --marketplace both --query "AirPods Pro 3" --limit 10
